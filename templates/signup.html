{% extends 'base.html' %}

{% block title %}Get Started — IntelliCard AI{% endblock %}

{% block content %}
<div class="auth-section" style="padding: 80px 0 120px; display: flex; justify-content: center; align-items: center;">
  <div class="container-sm" style="max-width: 480px; width: 100%;">
    <div class="glass-card fade-in" style="padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 32px;">
        <div class="nav-logo-icon" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 24px;">⚡</div>
        <h2 style="font-family: var(--font-disp); font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px;">Create Account</h2>
        <p style="color: var(--muted2); font-size: 14px;">Get started with AI-powered document learning</p>
      </div>

      <form action="/signup" method="POST" id="signup-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required autocomplete="email"/>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Min. 6 characters" minlength="6" required autocomplete="new-password"/>
        </div>

        <div class="form-group" style="margin-bottom: 28px;">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="••••••••" required autocomplete="new-password"/>
        </div>

        <button type="submit" class="btn btn-primary glow-pulse" style="width: 100%; margin-bottom: 20px;">
          Start Studying →
        </button>
      </form>

      <div style="text-align: center; font-size: 13px; color: var(--muted2);">
        Already have an account? <a href="/login" style="color: var(--cyan); font-weight: 600; text-decoration: underline;">Sign In</a>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('signup-form').addEventListener('submit', function(e) {
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  if (password !== confirm) {
    e.preventDefault();
    showToast('Passwords do not match!', 'error');
  }
});
</script>
{% endblock %}
