{% extends 'base.html' %}

{% block title %}Sign In — IntelliCard AI{% endblock %}

{% block content %}
<div class="auth-section" style="padding: 100px 0 140px; display: flex; justify-content: center; align-items: center;">
  <div class="container-sm" style="max-width: 480px; width: 100%;">
    <div class="glass-card fade-in" style="padding: 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 32px;">
        <div class="nav-logo-icon" style="margin: 0 auto 16px; width: 48px; height: 48px; font-size: 24px;">⚡</div>
        <h2 style="font-family: var(--font-disp); font-size: 28px; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px;">Welcome Back</h2>
        <p style="color: var(--muted2); font-size: 14px;">Sign in to continue generating and studying flashcards</p>
      </div>

      <form action="/login" method="POST">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="name@example.com" required autocomplete="email"/>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
          </div>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password"/>
        </div>

        <button type="submit" class="btn btn-primary glow-pulse" style="width: 100%; margin-bottom: 20px;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; font-size: 13px; color: var(--muted2);">
        Don't have an account? <a href="/signup" style="color: var(--cyan); font-weight: 600; text-decoration: underline;">Sign Up</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
